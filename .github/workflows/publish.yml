name: Publication npm

# Publie sur npm quand une release GitHub est créée (tag vX.Y.Z identique à package.json).
# Secret requis : NPM_TOKEN (token "Automation" créé sur npmjs.com)

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Le tag correspond à la version
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" || { echo "::error::Tag ${GITHUB_REF_NAME} ≠ version du package.json"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
